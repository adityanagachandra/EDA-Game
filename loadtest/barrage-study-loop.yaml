# Current-API study-loop baseline.
#
# Phase 0 only: this scenario measures the deployed architecture as it exists.
# It does not model a multiple-replica or Postgres deployment, because neither
# exists yet.
#
# Flow per virtual user:
#   create guest -> fetch a practice set -> submit one graded answer -> read scores
#
# The guest is created inside the loop because barrage scenarios have no setup
# phase. That makes each journey a new-learner journey, not a returning learner
# answering twenty questions. The scenario rate counts all four HTTP steps.
# Divide it by four for approximate answer submissions per second.
#
# Run against a scratch server:
#   go build -o /tmp/opencode/mathua-loadtest ./cmd/mathua
#   DATABASE_URL=/tmp/opencode/phase0.db MATHUA_LOADTEST=1 \
#     /tmp/opencode/mathua-loadtest -serve -port 18082 &
#   mise exec -- barrage run -c loadtest/barrage-study-loop.yaml \
#     --duration 60s --concurrency 20 --no-progress \
#     --json loadtest/phase0-c20.json --no-report
#
# MATHUA_LOADTEST=1 relaxes the rate limiters so this run measures the app.
# Never set it in production. The scratch database must not be production.

duration: 30s
bucket_width: 1s
ramp: 5s
concurrency: 20

scenario:
  - name: study-loop
    weight: 3
    steps:
      - method: POST
        url: http://localhost:18082/api/auth/guest
        body: '{}'
        headers:
          Content-Type: application/json
        extract:
          token: $.token
          student: $.student_id
      - method: GET
        url: http://localhost:18082/api/lessons/arith.add.single/practice
        headers:
          Authorization: Bearer {{token}}
        extract:
          question: $.questions.0.question
          answer: $.questions.0.answer
      - method: POST
        url: http://localhost:18082/api/study/answer
        body: '{"concept_id":"arith.add.single","answer":"{{answer}}","elapsed":1.5,"question":"{{question}}","submission_id":"{{student}}"}'
        headers:
          Content-Type: application/json
          Authorization: Bearer {{token}}
      - method: GET
        url: http://localhost:18082/api/scores/{{student}}
        headers:
          Authorization: Bearer {{token}}

  - name: read-browse
    weight: 1
    steps:
      - method: GET
        url: http://localhost:18082/api/graph
      - method: GET
        url: http://localhost:18082/api/leaderboard

# Read pressure against the same SQLite file the app uses. These are the shapes
# the profile, history and recommendation paths read, not synthetic table scans.
db:
  rate: 20
  target:
    driver: sqlite
    conn: /tmp/opencode/phase0.db
    max_open_conns: 8
    queries:
      - query: SELECT COUNT(*) FROM attempts
        weight: 20
        type: read
      - query: SELECT concept_id, status, streak FROM concept_progress LIMIT 50
        weight: 20
        type: read
      - query: SELECT id FROM sessions ORDER BY started_at DESC LIMIT 20
        weight: 15
        type: read
      - query: SELECT student_id, COUNT(*) FROM attempts GROUP BY student_id ORDER BY 2 DESC LIMIT 10
        weight: 15
        type: read
      - query: SELECT AVG(elapsed_seconds) FROM attempts
        weight: 10
        type: read
      - query: SELECT COUNT(*) FROM xp_events
        weight: 10
        type: read
      - query: SELECT concept_id FROM concept_progress WHERE student_id = 'loadtest' LIMIT 10
        weight: 10
        type: read
